[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3

[program:php-fpm]
command=php-fpm83 -F --daemonize
autostart=true
autorestart=true
stderr_logfile=/var/log/php-fpm.log
stdout_logfile=/var/log/php-fpm.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx-error.log
stdout_logfile=/var/log/nginx-access.log

[program:artisan]
command=/bin/bash -c "php artisan queue:work --sleep=3 --tries=1 && php artisan schedule:run"
autostart=false
autorestart=false
