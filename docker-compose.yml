services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelab-sentinel
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/framework/cache:/var/www/html/storage/framework/cache
      - ./storage/framework/sessions:/var/www/html/storage/framework/sessions
      - ./storage/framework/views:/var/www/html/storage/framework/views
      - ./storage/database:/var/www/html/storage/database
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/database/database.sqlite
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@localhost}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
